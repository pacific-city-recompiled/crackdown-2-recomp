# Mid-asm hooks (SDK [[midasm_hook]]). Every entry cites why it exists.
# SDK v0.10.0, default.xex + TU default.xexp (0.0.5.1).
#
# Game ms clock (--sim_game_clock, crackdown2/src/hooks_framerate.cpp). Same design as Crackdown 1.
# Each address is the `li rX,33` in an inlined per-frame ms choice
#   ms = [[0x82800B0C]+13] ? 33 : ([0x82800FB9] ? [0x8277ADCC] : 16)
# (`lwz ..,2828(..); lbz ..,13(..); cmplwi; beq L; li rX,33; b ...`, so the li is at L - 8; every site below
# was checked for that). The 16th, 0x827671A4, is the non-inlined copy sub_82767190 (`li r3,33; blr`).
# The clock is locked in retail, so these timers advance a fixed 33 ms per frame. After the li,
# Cd2FrameMs_<address> puts the measured frame ms in the register (it leaves 33 when the cvar is off or the
# site's bit in --sim_game_clock_sites is clear; bit 0 = first entry).

[[midasm_hook]]  # sub_823AAFE8
address = 0x823AB418
name = "Cd2FrameMs_823AB418"
registers = ["r11"]
after_instruction = true

